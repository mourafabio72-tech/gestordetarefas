services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: gestor_tarefas
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem 'ports': o Postgres fica acessível só na rede interna (não exposto à internet).

  backend:
    build: ./backend
    restart: always
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: gestor_tarefas
      SECRET_KEY: ${SECRET_KEY:-sua-chave-secreta-mude-em-producao}
      # Entrada pelo card do Hub. Vazio desliga o SSO e mantém o login por senha.
      ZOARIA_SSO_SECRET: ${ZOARIA_SSO_SECRET:-}
      # Origens que podem chamar a API pelo navegador. Vazio usa a lista padrão
      # do código (produção mais o desenvolvimento local).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ZAP_API_URL: ${ZAP_API_URL:-https://api-bps4.zapcontabil.chat}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      ZAP_CONNECTION_FROM: ${ZAP_CONNECTION_FROM:-0}
      ZAP_PHONE: ${ZAP_PHONE:-5521971985815}
      ALERT_DAYS_BEFORE: ${ALERT_DAYS_BEFORE:-3}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      # Comprovantes enviados pelo cliente (link público), gravados no volume persistente.
      UPLOAD_DIR: /app/data/uploads
      PUBLIC_URL: ${PUBLIC_URL:-https://gestordetarefas.zoaria.com.br}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - uploads:/app/data
    depends_on:
      - db
    # Sem 'ports': o backend é acessado internamente pelo nginx do frontend (proxy /api).

  frontend:
    build: ./frontend
    restart: always
    expose:
      - "80"   # EasyPanel/Traefik roteia o domínio para a porta 80 do container (sem publicar no host)
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:   # comprovantes enviados pelo cliente (persistente entre deploys)
