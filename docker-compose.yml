services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: gestor_tarefas
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem 'ports': o Postgres fica acessível só na rede interna (não exposto à internet).

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/gestor_tarefas
      SECRET_KEY: ${SECRET_KEY:-sua-chave-secreta-mude-em-producao}
      ZAP_API_URL: ${ZAP_API_URL:-https://api-bps4.zapcontabil.chat}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      ZAP_CONNECTION_FROM: ${ZAP_CONNECTION_FROM:-0}
      ZAP_PHONE: ${ZAP_PHONE:-5521971985815}
      ALERT_DAYS_BEFORE: ${ALERT_DAYS_BEFORE:-3}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
    depends_on:
      - db
    # Sem 'ports': o backend é acessado internamente pelo nginx do frontend (proxy /api).

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"   # EasyPanel roteia o domínio gestordetarefas.zoaria.com.br para cá
    depends_on:
      - backend

volumes:
  postgres_data:
